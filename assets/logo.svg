<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变色 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- AI大脑图标 -->
  <g transform="translate(100, 100)">
    <!-- 中心节点 -->
    <circle cx="0" cy="0" r="20" fill="url(#grad1)" filter="url(#glow)"/>
    
    <!-- 神经网络节点 -->
    <!-- 第一层 -->
    <circle cx="-50" cy="-30" r="12" fill="url(#grad2)" opacity="0.8"/>
    <circle cx="50" cy="-30" r="12" fill="url(#grad2)" opacity="0.8"/>
    <circle cx="-50" cy="30" r="12" fill="url(#grad2)" opacity="0.8"/>
    <circle cx="50" cy="30" r="12" fill="url(#grad2)" opacity="0.8"/>
    
    <!-- 第二层 -->
    <circle cx="-70" cy="0" r="10" fill="url(#grad1)" opacity="0.6"/>
    <circle cx="70" cy="0" r="10" fill="url(#grad1)" opacity="0.6"/>
    <circle cx="0" cy="-50" r="10" fill="url(#grad1)" opacity="0.6"/>
    <circle cx="0" cy="50" r="10" fill="url(#grad1)" opacity="0.6"/>
    
    <!-- 连接线 -->
    <line x1="0" y1="0" x2="-50" y2="-30" stroke="url(#grad1)" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="50" y2="-30" stroke="url(#grad1)" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="-50" y2="30" stroke="url(#grad1)" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="50" y2="30" stroke="url(#grad1)" stroke-width="2" opacity="0.5"/>
    
    <line x1="-50" y1="-30" x2="-70" y2="0" stroke="url(#grad2)" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="-30" x2="70" y2="0" stroke="url(#grad2)" stroke-width="1.5" opacity="0.4"/>
    <line x1="-50" y1="30" x2="-70" y2="0" stroke="url(#grad2)" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="30" x2="70" y2="0" stroke="url(#grad2)" stroke-width="1.5" opacity="0.4"/>
    
    <line x1="-50" y1="-30" x2="0" y2="-50" stroke="url(#grad2)" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="-30" x2="0" y2="-50" stroke="url(#grad2)" stroke-width="1.5" opacity="0.4"/>
    <line x1="-50" y1="30" x2="0" y2="50" stroke="url(#grad2)" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="30" x2="0" y2="50" stroke="url(#grad2)" stroke-width="1.5" opacity="0.4"/>
    
    <!-- 文档图标（右下角） -->
    <g transform="translate(55, 55)">
      <rect x="-8" y="-10" width="16" height="20" rx="2" fill="white" opacity="0.9"/>
      <line x1="-5" y1="-5" x2="5" y2="-5" stroke="url(#grad1)" stroke-width="1.5"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="url(#grad1)" stroke-width="1.5"/>
      <line x1="-5" y1="5" x2="5" y2="5" stroke="url(#grad1)" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- 外圈装饰 -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.3" stroke-dasharray="5,5">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 100 100"
      to="360 100 100"
      dur="20s"
      repeatCount="indefinite"/>
  </circle>
</svg>

